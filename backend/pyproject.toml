[project]
name = "vemai"
version = "0.1.0"
description = "PWA que avisa por Web Push quando o ônibus está chegando ao ponto"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "beautifulsoup4",
    "certifi",
    "pywebpush",
    "pydantic",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vemai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
