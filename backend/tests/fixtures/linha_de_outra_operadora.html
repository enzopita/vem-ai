<script>
function ExibeTabela(dia) {
	$('#div_tabela_1').hide();

	$('#btn_day2').removeClass('btn_daysh');
	$('#btn_day3').removeClass('btn_daysh');
	
	$('#btn_day'+dia).toggleClass('btn_daysh');
	$('#div_tabela_'+dia).show();
}
