<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b5fff">
  <title>Vem Aí</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <img src="/icon.svg" alt="" width="32" height="32">
    <h1>Vem Aí</h1>
  </header>

  <main>
    <div id="notice" class="notice" hidden></div>

    <section>
      <h2>1. Operadora</h2>
      <div id="operators" class="chips" role="radiogroup" aria-label="Operadora"></div>
    </section>

    <section id="stop-section" hidden>
      <h2>2. Ponto</h2>
      <label for="stop-query">Digite ao menos 3 letras do endereço</label>
      <input id="stop-query" type="search" autocomplete="off" placeholder="Ex.: Conselheiro Nébias">
      <ul id="stop-results" class="list"></ul>
    </section>

    <section id="board-section" hidden>
      <h2>3. Ônibus neste ponto</h2>
      <p id="stop-title" class="muted"></p>
      <ul id="board" class="list"></ul>
      <p id="board-updated" class="muted"></p>

      <form id="alert-form">
        <h3>Avisar-me quando chegar</h3>
        <label for="line">Linha</label>
        <select id="line" required></select>
        <label for="time">Horário em que costumo pegar</label>
        <input id="time" type="time" required>
        <label for="lead">Avisar com antecedência de (minutos)</label>
        <input id="lead" type="number" min="1" max="30" value="10" required>
        <button type="submit">Ativar alerta</button>
        <p class="muted">O alerta fica ativo de 30 min antes a 30 min depois do horário.</p>
      </form>
    </section>

    <section>
      <h2>Meus alertas</h2>
      <ul id="alerts" class="list"></ul>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
